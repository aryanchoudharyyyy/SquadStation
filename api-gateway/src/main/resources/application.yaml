server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: trip-service-route
              uri: lb://trip-service
              predicates:
                - Path=/api/trips/**
            - id: user-service-route
              uri: lb://user-service
              predicates:
                - Path=/api/users/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/