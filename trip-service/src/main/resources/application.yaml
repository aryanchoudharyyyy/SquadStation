spring:
  application:
    name: trip-service
  config:
    import: configserver:http://localhost:8888
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
        group:
          enabled: true


management:
  endpoints:
    web:
      exposure:
        include: health, circuitbreakers, circuitbreakerevents, retries
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
    mail: # <-- ADD THIS
      enabled: false    # <-- ADD THIS
resilience4j:
  circuitbreaker:
    instances:
      Group-service:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      Group-service:
        max-attempts: 3
        wait-duration: 500ms

feign:
  client:
    config:
      Group-service:
        connect-timeout: 2000
        read-timeout: 2000

server:
      port: 8082



